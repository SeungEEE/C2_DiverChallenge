# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: iOS CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # 프로젝트에 맞춰 고정 권장
          
      - name: Print Xcode & CLT
        run: |
          xcodebuild -version
          xcode-select -p

      # (디버그용) 사용 가능한 시뮬레이터 목록
      - name: List simulators
        run: xcrun simctl list devices available

      - name: Build (Simulator)
        env:
          CI: 1
        run: |
          set -eo pipefail
          xcodebuild \
            -project "DiverChallenge/DiverChallenge.xcodeproj" \
            -scheme "DiverChallenge" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            clean build

            
